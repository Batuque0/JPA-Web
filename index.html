<script>
(function () {
  const base = new URL("./", location.href).href;
  const manifest = {
    name: "Remitos JPA",
    short_name: "Remitos JPA",
    start_url: base,
    scope: base,
    display: "standalone",
    theme_color: "#1f3b5a",
    background_color: "#eef1f5",
    icons: [
      { src: new URL("logo_jpa.png", location.href).href, sizes: "any", type: "image/png", purpose: "any" }
    ]
  };
  document.getElementById("manifest").href =
    "data:application/manifest+json;charset=utf-8," + encodeURIComponent(JSON.stringify(manifest));
})();
</script>

<style>
  :root { --azul:#1f3b5a; --fondo:#eef1f5; --error:#b00020; }
  * { box-sizing:border-box; }
  html, body { margin:0; height:100%; background:var(--fondo); font-family:Calibri, Arial, sans-serif; color:#111; }
  body.vista-s3 { overflow:hidden; }

  .pantalla { display:none; min-height:100%; flex-direction:column; padding:16px;
              padding-top:max(16px, env(safe-area-inset-top)); padding-bottom:max(16px, env(safe-area-inset-bottom)); }
  .pantalla.activa { display:flex; }

  .centro { flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:28px; }
  .logo { width:200px; height:200px; border-radius:50%; object-fit:cover; background:#fff; box-shadow:0 4px 14px rgba(0,0,0,.15); }
  .btn { font:inherit; font-size:18px; border:0; border-radius:12px; padding:14px 22px; background:var(--azul);
         color:#fff; cursor:pointer; text-align:center; display:inline-block; margin:0; }
  .btn-sec { background:#fff; color:var(--azul); border:2px solid var(--azul); }
  .btn-grande { width:100%; max-width:420px; }
  .oculto { position:absolute; width:1px; height:1px; opacity:0; overflow:hidden; }
  .error { color:var(--error); min-height:1.2em; text-align:center; margin:0; }
  h2 { color:var(--azul); margin:8px 0 12px; }

  .campo { display:block; margin:12px 0; font-weight:600; }
  .campo input, .campo select { display:block; width:100%; font:inherit; font-size:18px; padding:12px;
        border:1px solid #bbb; border-radius:10px; margin-top:6px; background:#fff; }
  .aviso { background:#fff4d6; border-radius:10px; padding:10px; font-size:15px; margin-bottom:8px; }
  .btn-col { display:flex; flex-direction:column; gap:10px; align-items:center; margin-top:10px; }

  /* ── Pantalla 3: ocupa todo el alto disponible ── */
  #s3 { height:100vh; height:100dvh; min-height:0; padding:0; overflow:hidden; }
  .barra { flex-shrink:0; background:var(--azul); color:#fff; padding:14px 16px; font-size:18px; font-weight:600; }
  .deslizador { flex:1 1 auto; min-height:0; display:flex; overflow-x:auto; overflow-y:hidden;
                scroll-snap-type:x mandatory; -webkit-overflow-scrolling:touch; }
  .panel { flex:0 0 100%; width:100%; height:100%; min-height:0; overflow-y:auto; scroll-snap-align:start;

  .visor { max-width:700px; margin:0 auto; }

  .puntos { flex-shrink:0; text-align:center; padding:6px 0 0; }
  .pt { display:inline-block; width:9px; height:9px; border-radius:50%; background:#bbb; margin:0 4px; }
  .pt.on { background:var(--azul); }
  .hint { flex-shrink:0; text-align:center; font-size:14px; color:#555; margin:2px 0 6px; }
  .acciones { flex-shrink:0; display:flex; flex-direction:column; gap:10px; padding:12px 16px;
              padding-bottom:max(12px, env(safe-area-inset-bottom)); background:#fff; align-items:center; }
</style>

    <div>Remito: <b id="nroRemito"></b></div>

  </label>

<section id="s3" class="pantalla">
  <div class="barra" id="tituloS3">Remito</div>
  <div class="deslizador" id="deslizador">
    <div class="panel"><div class="visor" id="visorRemito"></div></div>
    <div class="panel"><div class="visor" id="visorOriginal"></div></div>
  </div>
  <div class="puntos"><span class="pt on" id="pt1"></span><span class="pt" id="pt2"></span></div>

    <button id="btnNuevo" class="btn btn-sec btn-grande">Nuevo</button>
  </div>
</section>

<script>
const GANANCIA = 0.135;
const EMPRESA = "DISTRIBUIDORA JPA";
const TIPO = "Comprobante";
const CONDICION = "Contado";
const $ = id => document.getElementById(id);

pdfjsLib.GlobalWorkerOptions.workerSrc =
  "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";

let estado = null;

// ── Service Worker (registro) ────────────────────────────────────────
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("sw.js").catch(err => console.error("SW:", err));
  });
}

// ── Utilidades ───────────────────────────────────────────────────────
function mostrar(id) {
  document.querySelectorAll(".pantalla").forEach(s => s.classList.toggle("activa", s.id === id));
  document.body.classList.toggle("vista-s3", id === "s3");
  window.scrollTo(0, 0);
}
const esc = s => String(s).replace(/[&<>"']/g, c =>
  ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
// Formato del ejemplo: $ 2,643.22
const fmtMoneda = n => "$ " + n.toLocaleString("en-US", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const hoy = () => new Date().toLocaleDateString("es-AR");
const referencia = numero => numero.split("-").pop().replace(/^0+/, "") || "0";

function descargar(blob, nombre) {
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = nombre;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 2000);
}

// "$1,682.96" o "$1.682,96" → 1682.96
function normalizarNumero(t) {
  let s = String(t).replace(/[$\s]/g, "");
  if (s.includes(",") && s.includes(".")) {
    s = s.lastIndexOf(".") > s.lastIndexOf(",")
      ? s.replace(/,/g, "")
      : s.replace(/\./g, "").replace(",", ".");
  } else if (s.includes(",")) {
    s = s.replace(",", ".");
  } else if (/^\d{1,3}(\.\d{3})+$/.test(s)) {
    s = s.replace(/\./g, "");
  }
  return parseFloat(s);
}

// ── Lectura del PDF (pdf.js) ─────────────────────────────────────────
async function leerLineas(bytes) {
  const pdf = await pdfjsLib.getDocument({ data: bytes.slice(0) }).promise;
  const lineas = [];
  for (let n = 1; n <= pdf.numPages; n++) {
    const page = await pdf.getPage(n);
    const tc = await page.getTextContent();
    const filas = [];
    for (const it of tc.items) {
      if (!it.str || !it.str.trim()) continue;
      const y = it.transform[5], x = it.transform[4];
      let f = filas.find(f => Math.abs(f.y - y) < 2);
      if (!f) { f = { y, items: [] }; filas.push(f); }
      f.items.push({ x, s: it.str });
    }
    filas.sort((a, b) => b.y - a.y);
    for (const f of filas) {
      f.items.sort((a, b) => a.x - b.x);
      lineas.push(f.items.map(i => i.s).join(" ").replace(/\s+/g, " ").trim());
    }
  }
  return lineas;
}

// ── Extracción (equivalente a extractor.py) ──────────────────────────
function parsearPdf(lineas) {
  const texto = lineas.join("\n");

  const mNro = texto.match(/Nro[:\s]+(\d{4}-\d{8})/i);
  const numero = mNro ? mNro[1] : null;

  const mDesc = texto.match(/Desc\s*\(%\s*([\d.,]+)\s*\)\s*:/i);
  const descuento = mDesc ? normalizarNumero(mDesc[1]) : null;

  // Cliente: la línea que sigue al CUIT (igual que extractor.py)
  let cliente = null;
  const iCuit = lineas.findIndex(l => /^CUIT:/i.test(l));
  if (iCuit >= 0) {
    const cand = (lineas[iCuit + 1] || "").trim();
    if (cand && !/^código/i.test(cand) && !/EAN/.test(cand)) {
      cliente = cand.toLowerCase().replace(/(^|\s)\S/g, c => c.toUpperCase());
    }
  }

  // Productos: [Código, EAN, Descripción..., UxB, UxI, Blt, %Desc, Precio, Total]
  const productos = [];
  const errores = [];
  for (const linea of lineas) {
    const t = linea.split(" ");
    if (t.length < 9 || !/^\d+$/.test(t[0]) || !/^\d{8,14}$/.test(t[1])) continue;
    const n = t.length;
    const total = t[n - 1], precio = t[n - 2];
    if (!precio.includes("$") || !total.includes("$")) continue;

    const cant = parseInt(t[n - 5], 10);   // UxI = bultos (Cant.)
    const un   = parseInt(t[n - 4], 10);   // Blt = unidades totales
    if (!cant || isNaN(un)) continue;

    const u = Math.floor(un / cant);        // U. = unidades por bulto
    const desc = t.slice(2, n - 6).join(" ");
    const precioOrig = normalizarNumero(precio);
    const descProd = normalizarNumero(t[n - 3]) || 0;
    const totalPdf = normalizarNumero(total);

    const esperado = u * cant * precioOrig * (1 - descProd / 100);
    if (Math.abs(esperado - totalPdf) > 1) {
      errores.push(`Revisar "${desc}": el total del PDF no coincide con el cálculo.`);
    }

    productos.push({ ean: t[1], desc, cant, u, precioOrig, descProd });
  }

  return { numero, descuento, cliente, productos, errores };
}

// ── Cálculos (equivalente a processor.py + main.py) ──────────────────
function calcular(datos) {
  const factor = (1 - datos.descuento / 100) * (1 + GANANCIA);
  let totalVenta = 0, bultos = 0;
  for (const p of datos.productos) {
    p.precioFinal = p.precioOrig * (1 - p.descProd / 100) * factor;
    p.subtotal = p.u * p.precioFinal * p.cant;
    totalVenta += p.subtotal;
    bultos += p.cant;
  }
  return { ...datos, factor, totalVenta, bultos };
}

// ── PDF del remito (jsPDF), layout de la factura de ejemplo ──────────
// Medidas en mm sobre A4 (210 × 297)
function cargarImagen(src) {
  return new Promise((res, rej) => {
    const img = new Image();
    img.onload = () => {
      const c = document.createElement("canvas");
      c.width = img.naturalWidth; c.height = img.naturalHeight;
      c.getContext("2d").drawImage(img, 0, 0);
      res({ data: c.toDataURL("image/png"), w: img.naturalWidth, h: img.naturalHeight });
    };
    img.onerror = rej;
    img.src = src;
  });
}

async function crearPdfRemito(r, logo) {
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({ unit: "mm", format: "a4" });

  const M = 19, R = 191, W = R - M;
  const TABLA_Y = 88.7;          // cabecera de la tabla
  const FILA_INI = TABLA_Y + 5;  // primera fila de productos
  const TOTALES_Y = 228.7;       // totales fijos (igual que writer.py: fila 42)
  const LIMITE_FILA = 262;
  const ref = referencia(r.numero);

  const COLS = [
    { t: "Código",      x: M,       w: 27, al: "right" },
    { t: "Descripción", x: M + 27,  w: 70, al: "left" },
    { t: "U.",          x: M + 97,  w: 11, al: "center" },
    { t: "Precio U.",   x: M + 108, w: 22, al: "right" },
    { t: "Cant.",       x: M + 130, w: 13, al: "center" },
    { t: "Subtotal",    x: M + 143, w: 29, al: "right" },
  ];
  const xTexto = c =>
    c.al === "left" ? c.x + 1 : c.al === "center" ? c.x + c.w / 2 : c.x + c.w - 1;

  // Cabecera de página: caja de empresa, CLIENTE y datos del cliente
  const dibujarEncabezado = () => {
    doc.setDrawColor(0);
    doc.setLineWidth(0.5);
    doc.rect(M, 26, W, 24);
    doc.line(117, 26, 117, 50);
    if (logo) doc.addImage(logo.data, "PNG", 31, 29.5, 15, 15 * logo.h / logo.w);

    doc.setFont("helvetica", "bold"); doc.setFontSize(10);
    doc.text(EMPRESA, 54, 37.7);

    doc.setFont("helvetica", "normal"); doc.setFontSize(9);
    doc.text("ORIGINAL", R - 2, 28, { align: "right" });
    doc.setFont("helvetica", "bold");
    doc.text(TIPO, 119, 33);
    doc.setFont("helvetica", "normal");
    doc.text("Fecha de emisión:", 119, 42.5);
    doc.text(hoy(), R - 2, 47.6, { align: "right" });

    doc.setLineWidth(0.3);
    doc.rect(M, 50, W, 5);
    doc.rect(M, 55, W, 5);
    doc.text("CLIENTE", M + 1, 58.6);

    doc.rect(M, 65, W, 19);
    doc.text(`Apellido y nombre/ razon social:  ${r.cliente}`, M + 1, 68.6);
    doc.text(`Referencia: ${ref}`, M + 1, 72.7);
    doc.text("Localidad y Dirección:", M + 1, 76.8);
    doc.text(`Condicion: ${CONDICION}`, M + 1, 80.9);
  };

  const dibujarTablaHeader = () => {
    doc.setLineWidth(0.3);
    doc.setFont("helvetica", "bold"); doc.setFontSize(8);
    doc.rect(M, TABLA_Y, W, 5);
    COLS.slice(1).forEach(c => doc.line(c.x, TABLA_Y, c.x, TABLA_Y + 5));
    COLS.forEach(c => doc.text(c.t, xTexto(c), TABLA_Y + 3.5, { align: c.al }));
    doc.setFont("helvetica", "normal");
  };

  const nuevaPagina = () => {
    doc.addPage();
    dibujarEncabezado();
    dibujarTablaHeader();
  };

  dibujarEncabezado();
  dibujarTablaHeader();

  // Filas de productos
  let y = FILA_INI;
  doc.setFontSize(7.5);
  for (const p of r.productos) {
    const lineas = doc.splitTextToSize(p.desc, COLS[1].w - 2);
    const h = Math.max(5, lineas.length * 3.4 + 1.6);
    if (y + h > LIMITE_FILA) {
      nuevaPagina();
      y = FILA_INI;
    }
    doc.setLineWidth(0.3);
    doc.rect(M, y, W, h);
    COLS.slice(1).forEach(c => doc.line(c.x, y, c.x, y + h));

    const vals = [p.ean, "", String(p.u), fmtMoneda(p.precioFinal), String(p.cant), fmtMoneda(p.subtotal)];
    doc.setFontSize(7.5);
    COLS.forEach((c, i) => {
      if (i === 1) lineas.forEach((ln, k) => doc.text(ln, c.x + 1, y + 3.5 + k * 3.4));
      else doc.text(vals[i], xTexto(c), y + 3.5, { align: c.al });
    });
    y += h;
  }

  // Totales (Bultos y Total) bajo las columnas Cant. y Subtotal
  let yTot = Math.max(TOTALES_Y, y);
  if (yTot + 10 + 2.8 + 30 > 285) {
    nuevaPagina();
    yTot = FILA_INI;
  }
  const dibujarTotal = (yy, label, valor) => {
    doc.setFont("helvetica", "normal"); doc.setFontSize(8);
    doc.rect(COLS[4].x, yy, COLS[4].w, 5);
    doc.rect(COLS[5].x, yy, COLS[5].w, 5);
    doc.text(label, COLS[4].x + 1, yy + 3.5);
    doc.text(valor, R - 1, yy + 3.5, { align: "right" });
  };
  dibujarTotal(yTot, "BULTOS", String(r.bultos));
  dibujarTotal(yTot + 5, "TOTAL", fmtMoneda(r.totalVenta));

  // Caja de pie
  const yPie = yTot + 10 + 2.8;
  doc.setLineWidth(0.5);
  doc.rect(M, yPie, W, 30);
  doc.setLineWidth(0.3);
  doc.setFont("helvetica", "normal"); doc.setFontSize(9);
  doc.text("Comprobante No Autorizado", M + 1, yPie + 5);

  // Pie de página en todas las hojas
  const total = doc.internal.getNumberOfPages();
  for (let i = 1; i <= total; i++) {
    doc.setPage(i);
    doc.setFont("helvetica", "normal"); doc.setFontSize(8);
    doc.text(r.cliente, M, 284);
    doc.text(`Ref: ${ref}  |  ${hoy()}`, 105, 284, { align: "center" });
    doc.text(`Página ${i} de ${total}`, R, 284, { align: "right" });
  }
  return doc.output("blob");
}

// ── Visor de PDF (pdf.js): muestra todas las hojas ───────────────────
async function renderPdfEn(bytes, contenedorId) {
  const cont = $(contenedorId);
  cont.innerHTML = "";
  const pdf = await pdfjsLib.getDocument({ data: bytes.slice(0) }).promise;
  const ancho = $("deslizador").clientWidth - 24;
  for (let n = 1; n <= pdf.numPages; n++) {
    const page = await pdf.getPage(n);
    const vp1 = page.getViewport({ scale: 1 });
    const vp = page.getViewport({ scale: (ancho * 2) / vp1.width });
    const canvas = document.createElement("canvas");
    canvas.width = vp.width; canvas.height = vp.height;
    cont.appendChild(canvas);
    await page.render({ canvasContext: canvas.getContext("2d"), viewport: vp }).promise;
  }
}

// ── Flujo ────────────────────────────────────────────────────────────
$("archivo").addEventListener("change", async e => {
  const file = e.target.files[0];
  if (!file) return;
  $("err1").textContent = "";
  $("cargando").hidden = false;
  try {
    const bytes = new Uint8Array(await file.arrayBuffer());
    const lineas = await leerLineas(bytes);
    const datos = parsearPdf(lineas);
    if (!datos.numero) throw new Error("no se encontró el número de remito. ¿Es el PDF correcto?");
    if (!datos.productos.length) throw new Error("no se encontraron productos en el PDF.");
    estado = { bytes, ...datos };
    cargarPantalla2();
    mostrar("s2");
  } catch (err) {
    $("err1").textContent = "Error: " + err.message;
  } finally {
    $("cargando").hidden = true;
    e.target.value = "";
  }
});

function cargarPantalla2() {
  $("nroRemito").textContent = estado.numero;
  $("cantProd").textContent = estado.productos.length;
  $("cliente").value = estado.cliente || "";
  $("descTxt").textContent = estado.descuento != null ? `${estado.descuento} %` : "no detectado";
  $("bloqueDesc").hidden = estado.descuento != null;
  $("descManual").value = "";
  $("avisos").innerHTML = estado.errores.length
    ? `<div class="aviso">${estado.errores.map(esc).join("<br>")}</div>` : "";
  $("err2").textContent = "";
}

$("btnVolver").addEventListener("click", () => mostrar("s1"));

$("btnGenerar").addEventListener("click", async () => {
  const cliente = $("cliente").value.trim();
  let descuento = estado.descuento;
  if (descuento == null) {
    const v = $("descManual").value;
    if (v === "") { $("err2").textContent = "Elegí el porcentaje de descuento."; return; }
    descuento = parseFloat(v);
  }
  if (!cliente) { $("err2").textContent = "Ingresá el nombre del cliente."; return; }

  $("err2").textContent = "";
  const r = calcular({ ...estado, cliente, descuento });
  estado.resultado = r;

  let logo = null;
  try { logo = await cargarImagen("logo_jpa.png"); } catch (e) { /* sin logo */ }

  r.pdfBlob = await crearPdfRemito(r, logo);
  const bytesRemito = new Uint8Array(await r.pdfBlob.arrayBuffer());

  $("tituloS3").textContent = `Remito ${r.numero}`;
  $("deslizador").scrollLeft = 0;
  mostrar("s3");

  await renderPdfEn(bytesRemito, "visorRemito");
  renderPdfEn(estado.bytes, "visorOriginal").catch(err => console.error(err));
});

$("deslizador").addEventListener("scroll", () => {
  const d = $("deslizador");
  const i = Math.round(d.scrollLeft / d.clientWidth);
  $("pt1").classList.toggle("on", i === 0);
  $("pt2").classList.toggle("on", i === 1);
});

$("btnEnviar").addEventListener("click", async () => {
  const r = estado.resultado;
  const file = new File([r.pdfBlob], `Remito_${r.numero}.pdf`, { type: "application/pdf" });
  if (navigator.canShare && navigator.canShare({ files: [file] })) {
    try {
      await navigator.share({ files: [file], title: `Remito ${r.numero}` });
    } catch (e) {
      if (e.name !== "AbortError") alert("No se pudo compartir: " + e.message);
    }
  } else {
    descargar(r.pdfBlob, file.name);
    alert("Este navegador no permite compartir archivos. Se descargó el PDF.");
  }
});

$("btnNuevo").addEventListener("click", () => { estado = null; mostrar("s1"); });
</script>
</body>
