<!-- Manifest inline (data URI). Se arma en JS para resolver bien las URLs de los íconos -->
<link id="manifest" rel="manifest" href="">
<script>
(function () {
  const base = new URL("./", location.href).href;
  const manifest = {
    name: "Remitos JPA",
    short_name: "Remitos JPA",
    start_url: base,
    scope: base,
    display: "standalone",
    theme_color: "#1f3b5a",
    background_color: "#eef1f5",
    icons: [
      { src: new URL("logo_jpa.png", location.href).href, sizes: "any", type: "image/png", purpose: "any" }
    ]
  };
  document.getElementById("manifest").href =
    "data:application/manifest+json;charset=utf-8," + encodeURIComponent(JSON.stringify(manifest));
})();
</script>

<style>
  :root { --azul:#1f3b5a; --fondo:#eef1f5; --error:#b00020; }
  * { box-sizing:border-box; }
  html, body { margin:0; height:100%; background:var(--fondo); font-family:Calibri, Arial, sans-serif; color:#111; }
  body.vista-s3 { overflow:hidden; }

  .pantalla { display:none; min-height:100%; flex-direction:column; padding:16px;
              padding-top:max(16px, env(safe-area-inset-top)); padding-bottom:max(16px, env(safe-area-inset-bottom)); }
  .pantalla.activa { display:flex; }

  .centro { flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:28px; }
  .logo { width:200px; height:200px; border-radius:50%; object-fit:cover; background:#fff; box-shadow:0 4px 14px rgba(0,0,0,.15); }
  .btn { font:inherit; font-size:18px; border:0; border-radius:12px; padding:14px 22px; background:var(--azul);
         color:#fff; cursor:pointer; text-align:center; display:inline-block; margin:0; }
  .btn-sec { background:#fff; color:var(--azul); border:2px solid var(--azul); }
  .btn-grande { width:100%; max-width:420px; }
  .oculto { position:absolute; width:1px; height:1px; opacity:0; overflow:hidden; }
  .error { color:var(--error); min-height:1.2em; text-align:center; margin:0; }
  h2 { color:var(--azul); margin:8px 0 12px; }
  .tarjeta { background:#fff; border-radius:14px; padding:14px; margin-bottom:12px; }
  .campo { display:block; margin:12px 0; font-weight:600; }
  .campo input, .campo select { display:block; width:100%; font:inherit; font-size:18px; padding:12px;
        border:1px solid #bbb; border-radius:10px; margin-top:6px; background:#fff; }
  .aviso { background:#fff4d6; border-radius:10px; padding:10px; font-size:15px; margin-bottom:8px; }
  .btn-col { display:flex; flex-direction:column; gap:10px; align-items:center; margin-top:10px; }

  /* ── Pantalla 3: ocupa todo el alto disponible ── */
  #s3 { height:100vh; height:100dvh; min-height:0; padding:0; overflow:hidden; }
  .barra { flex-shrink:0; background:var(--azul); color:#fff; padding:14px 16px; font-size:18px; font-weight:600; }
  .deslizador { flex:1 1 auto; min-height:0; display:flex; overflow-x:auto; overflow-y:hidden;
                scroll-snap-type:x mandatory; -webkit-overflow-scrolling:touch; }
  .panel { flex:0 0 100%; width:100%; height:100%; min-height:0; overflow-y:auto; scroll-snap-align:start;
           padding:12px; -webkit-overflow-scrolling:touch; }
  .hoja { background:#fff; box-shadow:0 2px 8px rgba(0,0,0,.12); padding:14px; max-width:700px; margin:0 auto; }
  .puntos { flex-shrink:0; text-align:center; padding:6px 0 0; }
  .pt { display:inline-block; width:9px; height:9px; border-radius:50%; background:#bbb; margin:0 4px; }
  .pt.on { background:var(--azul); }
  .hint { flex-shrink:0; text-align:center; font-size:14px; color:#555; margin:2px 0 6px; }
  .acciones { flex-shrink:0; display:flex; flex-direction:column; gap:10px; padding:12px 16px;
              padding-bottom:max(12px, env(safe-area-inset-bottom)); background:#fff; align-items:center; }
  #canvasOriginal { width:100%; height:auto; display:block; background:#fff; }

  /* ── Hoja del remito (replica el orden pedido) ── */
  .cab { display:flex; justify-content:space-between; gap:10px; align-items:flex-start; }
  .cab-izq img { width:110px; display:block; margin-bottom:4px; }
  .cab-izq .empresa { font-weight:700; font-size:15px; }
  .cab-izq div { font-size:13px; line-height:1.5; }
  .cab-der { text-align:right; font-size:13px; line-height:1.7; }
  .cab-der .tipo { font-weight:700; font-size:16px; }
  .cuadro { border:1px solid #333; padding:8px 10px; font-size:13px; margin:12px 0; }
  .cuadro div { line-height:1.7; }
  table { width:100%; border-collapse:collapse; font-size:13px; }
  th, td { border:1px solid #333; padding:4px 5px; }
  th { background:#eee; }
  .n { text-align:right; }
  .c { text-align:center; }
  .tot td { font-weight:600; border:none; padding:3px 5px; }
  .pie { font-size:12px; margin-top:12px; }
</style>

<script>
const GANANCIA = 0.135;
const EMPRESA = "DISTRIBUIDORA JPA";
const CONDICION = "Contado";
const TIPO = "Comprobante";
const JPA_DOMICILIO = "";   // completar con el domicilio de JPA (si está vacío no se imprime)
const JPA_CUIT = "";        // completar con el CUIT de JPA
const $ = id => document.getElementById(id);

pdfjsLib.GlobalWorkerOptions.workerSrc =
  "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";

let estado = null;

// ── Service Worker (registro) ────────────────────────────────────────
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("sw.js").catch(err => console.error("SW:", err));
  });
}

// ── Utilidades ───────────────────────────────────────────────────────
function mostrar(id) {
  document.querySelectorAll(".pantalla").forEach(s => s.classList.toggle("activa", s.id === id));
  document.body.classList.toggle("vista-s3", id === "s3");
  window.scrollTo(0, 0);
}
const esc = s => String(s).replace(/[&<>"']/g, c =>
  ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmtMoneda = n =>
  n.toLocaleString("es-AR", {style:"currency", currency:"ARS"}).replace(/\u00a0/g, " ");
const hoy = () => new Date().toLocaleDateString("es-AR");
const referencia = numero => numero.split("-").pop().replace(/^0+/, "") || "0";

function descargar(blob, nombre) {
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = nombre;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 2000);
}

// "$1,682.96" o "$1.682,96" → 1682.96
function normalizarNumero(t) {
  let s = String(t).replace(/[$\s]/g, "");
  if (s.includes(",") && s.includes(".")) {
    s = s.lastIndexOf(".") > s.lastIndexOf(",")
      ? s.replace(/,/g, "")
      : s.replace(/\./g, "").replace(",", ".");
  } else if (s.includes(",")) {
    s = s.replace(",", ".");
  } else if (/^\d{1,3}(\.\d{3})+$/.test(s)) {
    s = s.replace(/\./g, "");
  }
  return parseFloat(s);
}

// ── Lectura del PDF (pdf.js) ─────────────────────────────────────────
async function leerLineas(bytes) {
  const pdf = await pdfjsLib.getDocument({ data: bytes.slice(0) }).promise;
  const lineas = [];
  for (let n = 1; n <= pdf.numPages; n++) {
    const page = await pdf.getPage(n);
    const tc = await page.getTextContent();
    const filas = [];
    for (const it of tc.items) {
      if (!it.str || !it.str.trim()) continue;
      const y = it.transform[5], x = it.transform[4];
      let f = filas.find(f => Math.abs(f.y - y) < 2);
      if (!f) { f = { y, items: [] }; filas.push(f); }
      f.items.push({ x, s: it.str });
    }
    filas.sort((a, b) => b.y - a.y);
    for (const f of filas) {
      f.items.sort((a, b) => a.x - b.x);
      lineas.push(f.items.map(i => i.s).join(" ").replace(/\s+/g, " ").trim());
    }
  }
  return lineas;
}

// ── Extracción (equivalente a extractor.py) ──────────────────────────
function parsearPdf(lineas) {
  const texto = lineas.join("\n");

  const mNro = texto.match(/Nro[:\s]+(\d{4}-\d{8})/i);
  const numero = mNro ? mNro[1] : null;

  const mDesc = texto.match(/Desc\s*\(%\s*([\d.,]+)\s*\)\s*:/i);
  const descuento = mDesc ? normalizarNumero(mDesc[1]) : null;

  const mCuit = texto.match(/CUIT:\s*([\d-]+)/i);
  const cuit = mCuit ? mCuit[1] : null;

  // Cliente: la línea que sigue al CUIT (igual que extractor.py)
  let cliente = null;
  const iCuit = lineas.findIndex(l => /^CUIT:/i.test(l));
  if (iCuit >= 0) {
    const cand = (lineas[iCuit + 1] || "").trim();
    if (cand && !/^código/i.test(cand) && !/EAN/.test(cand)) {
      cliente = cand.toLowerCase().replace(/(^|\s)\S/g, c => c.toUpperCase());
    }
  }

  // Productos: [Código, EAN, Descripción..., UxB, UxI, Blt, %Desc, Precio, Total]
  const productos = [];
  const errores = [];
  for (const linea of lineas) {
    const t = linea.split(" ");
    if (t.length < 9 || !/^\d+$/.test(t[0]) || !/^\d{8,14}$/.test(t[1])) continue;
    const n = t.length;
    const total = t[n - 1], precio = t[n - 2];
    if (!precio.includes("$") || !total.includes("$")) continue;

    const cant = parseInt(t[n - 5], 10);   // UxI = bultos (Cant.)
    const un   = parseInt(t[n - 4], 10);   // Blt = unidades totales
    if (!cant || isNaN(un)) continue;

    const u = Math.floor(un / cant);        // U. = unidades por bulto
    const desc = t.slice(2, n - 6).join(" ");
    const precioOrig = normalizarNumero(precio);
    const descProd = normalizarNumero(t[n - 3]) || 0;
    const totalPdf = normalizarNumero(total);

    const esperado = u * cant * precioOrig * (1 - descProd / 100);
    if (Math.abs(esperado - totalPdf) > 1) {
      errores.push(`Revisar "${desc}": el total del PDF no coincide con el cálculo.`);
    }

    productos.push({ ean: t[1], desc, cant, u, precioOrig, descProd });
  }

  return { numero, descuento, cuit, cliente, productos, errores };
}

// ── Cálculos (equivalente a processor.py + main.py) ──────────────────
function calcular(datos) {
  const factor = (1 - datos.descuento / 100) * (1 + GANANCIA);
  let totalVenta = 0, bultos = 0;
  for (const p of datos.productos) {
    p.precioFinal = p.precioOrig * (1 - p.descProd / 100) * factor;
    p.subtotal = p.u * p.precioFinal * p.cant;
    totalVenta += p.subtotal;
    bultos += p.cant;
  }
  return { ...datos, factor, totalVenta, bultos };
}

// ── Hoja HTML: orden visual pedido ───────────────────────────────────
function htmlHoja(r) {
  const filas = r.productos.map(p => `
    <tr>
      <td class="c">${esc(p.ean)}</td>
      <td>${esc(p.desc)}</td>
      <td class="c">${p.cant}</td>
      <td class="c">${p.u}</td>
      <td class="n">${fmtMoneda(p.precioFinal)}</td>
      <td class="n">${fmtMoneda(p.subtotal)}</td>
    </tr>`).join("");

  return `
    <div class="cab">
      <div class="cab-izq">
        <img src="logo_jpa.png" alt="JPA">
        <div class="empresa">${esc(EMPRESA)}</div>
        ${JPA_DOMICILIO ? `<div>${esc(JPA_DOMICILIO)}</div>` : ""}
        ${JPA_CUIT ? `<div>CUIT: ${esc(JPA_CUIT)}</div>` : ""}
      </div>
      <div class="cab-der">
        <div class="tipo">${esc(TIPO)}</div>
        <div>N° ${esc(r.numero)}</div>
        <div>Fecha: ${hoy()}</div>
      </div>
    </div>
    <div class="cuadro">
      <div><b>Nombre / Razón Social:</b> ${esc(r.cliente)}</div>
      <div><b>Domicilio:</b> ${esc(r.domicilio || "")}</div>
      <div><b>Localidad:</b> ${esc(r.localidad || "")}</div>
      <div><b>CUIT / Condición:</b> ${esc(r.cuit || "—")} / ${esc(CONDICION)}</div>
      <div><b>Referencia:</b> ${esc(referencia(r.numero))}</div>
    </div>
    <table>
      <thead><tr>
        <th>Código</th><th>Descripción</th><th class="c">Cant. Bultos</th>
        <th class="c">U. x Bulto</th><th class="n">Precio U.</th><th class="n">Subtotal</th>
      </tr></thead>
      <tbody>${filas}</tbody>
    </table>
    <table style="border:none; margin-top:6px">
      <tr class="tot"><td style="width:50%"></td><td class="n">BULTOS</td><td class="n">${r.bultos}</td></tr>
      <tr class="tot"><td></td><td class="n">IMPORTE TOTAL</td><td class="n">${fmtMoneda(r.totalVenta)}</td></tr>
    </table>
    <div class="pie">Comprobante No Autorizado</div>`;
}

// ── PDF para compartir (jsPDF): mismo orden visual ───────────────────
function cargarImagen(src) {
  return new Promise((res, rej) => {
    const img = new Image();
    img.onload = () => {
      const c = document.createElement("canvas");
      c.width = img.naturalWidth; c.height = img.naturalHeight;
      c.getContext("2d").drawImage(img, 0, 0);
      res({ data: c.toDataURL("image/png"), w: img.naturalWidth, h: img.naturalHeight });
    };
    img.onerror = rej;
    img.src = src;
  });
}

async function crearPdfRemito(r) {
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({ unit: "mm", format: "a4" });
  const M = 15, R = 195, topY = 14;
  const ref = referencia(r.numero);

  // Encabezado izquierda: logo + datos de JPA
  let altoLogo = 0;
  try {
    const logo = await cargarImagen("logo_jpa.png");
    altoLogo = 26 * logo.h / logo.w;
    doc.addImage(logo.data, "PNG", M, topY, 26, altoLogo);
  } catch (e) { /* sin logo, sigue igual */ }

  let yIzq = topY + altoLogo + 4;
  doc.setFont("helvetica", "bold"); doc.setFontSize(11);
  doc.text(EMPRESA, M, yIzq); yIzq += 5;
  doc.setFont("helvetica", "normal"); doc.setFontSize(9);
  if (JPA_DOMICILIO) { doc.text(JPA_DOMICILIO, M, yIzq); yIzq += 4.5; }
  if (JPA_CUIT) { doc.text(`CUIT: ${JPA_CUIT}`, M, yIzq); yIzq += 4.5; }

  // Encabezado derecha: tipo, número y fecha
  doc.setFont("helvetica", "bold"); doc.setFontSize(12);
  doc.text(TIPO, R, topY + 4, { align: "right" });
  doc.setFont("helvetica", "normal"); doc.setFontSize(10);
  doc.text(`N° ${r.numero}`, R, topY + 11, { align: "right" });
  doc.text(`Fecha: ${hoy()}`, R, topY + 17, { align: "right" });

  // Cuadro cliente
  let y = Math.max(yIzq, topY + 22) + 4;
  const filasCli = [
    ["Nombre / Razón Social", r.cliente],
    ["Domicilio", r.domicilio || ""],
    ["Localidad", r.localidad || ""],
    ["CUIT / Condición", `${r.cuit || "—"}  /  ${CONDICION}`],
    ["Referencia", ref],
  ];
  const altoCli = filasCli.length * 6 + 4;
  doc.setDrawColor(60);
  doc.rect(M, y, R - M, altoCli);
  filasCli.forEach(([lab, val], i) => {
    const yy = y + 6 + i * 6;
    doc.setFont("helvetica", "bold"); doc.setFontSize(9); doc.text(`${lab}:`, M + 2, yy);
    doc.setFont("helvetica", "normal"); doc.text(String(val), M + 48, yy);
  });
  y += altoCli + 6;

  // Tabla de 6 columnas
  const cols = [
    { t: "Código",       x: M,        w: 20, al: "left" },
    { t: "Descripción",  x: M + 20,   w: 58, al: "left" },
    { t: "Cant. Bultos", x: M + 78,   w: 20, al: "center" },
    { t: "U. x Bulto",   x: M + 98,   w: 20, al: "center" },
    { t: "Precio U.",    x: M + 118,  w: 30, al: "right" },
    { t: "Subtotal",     x: M + 148,  w: 32, al: "right" },
  ];
  const xTexto = c => c.al === "left" ? c.x + 1 : c.al === "center" ? c.x + c.w / 2 : c.x + c.w - 1;

  const dibujarEncabezado = () => {
    doc.setFont("helvetica", "bold"); doc.setFontSize(8);
    doc.setFillColor(230, 230, 230);
    doc.rect(M, y, R - M, 6, "FD");
    cols.forEach(c => doc.text(c.t, xTexto(c), y + 4, { align: c.al }));
    y += 6;
    doc.setFont("helvetica", "normal");
  };

  dibujarEncabezado();
  for (const p of r.productos) {
    doc.setFontSize(8.5);
    const descLineas = doc.splitTextToSize(p.desc, cols[1].w - 2);
    const h = Math.max(6, descLineas.length * 4 + 2);
    if (y + h > 265) {
      doc.addPage(); y = 15; dibujarEncabezado(); doc.setFontSize(8.5);
    }
    doc.rect(M, y, R - M, h);
    cols.slice(1).forEach(c => doc.line(c.x, y, c.x, y + h));
    const vals = [p.ean, "", String(p.cant), String(p.u), fmtMoneda(p.precioFinal), fmtMoneda(p.subtotal)];
    cols.forEach((c, i) => {
      if (i === 1) descLineas.forEach((ln, k) => doc.text(ln, c.x + 1, y + 4 + k * 4));
      else doc.text(vals[i], xTexto(c), y + 4, { align: c.al });
    });
    y += h;
  }

  // Resumen: totales alineados a la derecha
  if (y + 30 > 280) { doc.addPage(); y = 15; }
  y += 4;
  doc.setFont("helvetica", "bold"); doc.setFontSize(9);
  doc.text("BULTOS", cols[5].x - 2, y + 4, { align: "right" });
  doc.text(String(r.bultos), R, y + 4, { align: "right" });
  y += 6;
  doc.text("IMPORTE TOTAL", cols[5].x - 2, y + 4, { align: "right" });
  doc.text(fmtMoneda(r.totalVenta), R, y + 4, { align: "right" });
  y += 6;

  // Leyenda del pie
  y += 8;
  doc.setFont("helvetica", "normal"); doc.setFontSize(9);
  doc.text("Comprobante No Autorizado", M, y);

  const total = doc.internal.getNumberOfPages();
  for (let i = 1; i <= total; i++) {
    doc.setPage(i); doc.setFontSize(8);
    doc.text(`${r.cliente} | Ref: ${ref} | Página ${i} de ${total}`, R, 290, { align: "right" });
  }
  return doc.output("blob");
}

// ── Render del PDF original (pdf.js) ─────────────────────────────────
async function renderizarOriginal(bytes) {
  const pdf = await pdfjsLib.getDocument({ data: bytes.slice(0) }).promise;
  const page = await pdf.getPage(1);
  const ancho = $("deslizador").clientWidth - 24;
  const vp1 = page.getViewport({ scale: 1 });
  const vp = page.getViewport({ scale: (ancho * 2) / vp1.width });
  const canvas = $("canvasOriginal");
  canvas.width = vp.width; canvas.height = vp.height;
  await page.render({ canvasContext: canvas.getContext("2d"), viewport: vp }).promise;
}

// ── Flujo ────────────────────────────────────────────────────────────
$("archivo").addEventListener("change", async e => {
  const file = e.target.files[0];
  if (!file) return;
  $("err1").textContent = "";
  $("cargando").hidden = false;
  try {
    const bytes = new Uint8Array(await file.arrayBuffer());
    const lineas = await leerLineas(bytes);
    const datos = parsearPdf(lineas);
    if (!datos.numero) throw new Error("no se encontró el número de remito. ¿Es el PDF correcto?");
    if (!datos.productos.length) throw new Error("no se encontraron productos en el PDF.");
    estado = { bytes, ...datos };
    cargarPantalla2();
    mostrar("s2");
  } catch (err) {
    $("err1").textContent = "Error: " + err.message;
  } finally {
    $("cargando").hidden = true;
    e.target.value = "";
  }
});

function cargarPantalla2() {
  $("nroRemito").textContent = estado.numero;
  $("cuitTxt").textContent = estado.cuit || "no detectado";
  $("cantProd").textContent = estado.productos.length;
  $("cliente").value = estado.cliente || "";
  $("domicilio").value = "";
  $("localidad").value = "";
  $("descTxt").textContent = estado.descuento != null ? `${estado.descuento} %` : "no detectado";
  $("bloqueDesc").hidden = estado.descuento != null;
  $("descManual").value = "";
  $("avisos").innerHTML = estado.errores.length
    ? `<div class="aviso">${estado.errores.map(esc).join("<br>")}</div>` : "";
  $("err2").textContent = "";
}

$("btnVolver").addEventListener("click", () => mostrar("s1"));

$("btnGenerar").addEventListener("click", async () => {
  const cliente = $("cliente").value.trim();
  let descuento = estado.descuento;
  if (descuento == null) {
    const v = $("descManual").value;
    if (v === "") { $("err2").textContent = "Elegí el porcentaje de descuento."; return; }
    descuento = parseFloat(v);
  }
  if (!cliente) { $("err2").textContent = "Ingresá el nombre del cliente."; return; }

  $("err2").textContent = "";
  const r = calcular({
    ...estado, cliente, descuento,
    domicilio: $("domicilio").value.trim(),
    localidad: $("localidad").value.trim(),
  });
  estado.resultado = r;
  r.pdfBlob = await crearPdfRemito(r);

  $("hoja").innerHTML = htmlHoja(r);
  $("tituloS3").textContent = `Remito ${r.numero}`;
  $("deslizador").scrollLeft = 0;
  mostrar("s3");
  renderizarOriginal(estado.bytes).catch(err => console.error(err));
});

$("deslizador").addEventListener("scroll", () => {
  const d = $("deslizador");
  const i = Math.round(d.scrollLeft / d.clientWidth);
  $("pt1").classList.toggle("on", i === 0);
  $("pt2").classList.toggle("on", i === 1);
});

$("btnEnviar").addEventListener("click", async () => {
  const r = estado.resultado;
  const file = new File([r.pdfBlob], `Remito_${r.numero}.pdf`, { type: "application/pdf" });
  if (navigator.canShare && navigator.canShare({ files: [file] })) {
    try {
      await navigator.share({ files: [file], title: `Remito ${r.numero}` });
    } catch (e) {
      if (e.name !== "AbortError") alert("No se pudo compartir: " + e.message);
    }
  } else {
    descargar(r.pdfBlob, file.name);
    alert("Este navegador no permite compartir archivos. Se descargó el PDF.");
  }
});

$("btnNuevo").addEventListener("click", () => { estado = null; mostrar("s1"); });
</script>
